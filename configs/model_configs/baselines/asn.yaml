# nn:
name: "ASN"
gnn: "gcn"

num_layers: 3
hid_dim: 64
dropout_ratio: 0.0

# filename: "gnn_test.txt"
activation: "relu"

mode: "node"

# for each hop, the number of neighbors to sample
num_neigh: -1 ### need to find the best number of neighbors
batch_size: 0
epochs: 200

optimizer: "Adam"
lr: 0.03
weight_decay: 0.0005



mmd: True
mmd_weight: 0.1

adv: False
adv_weight: 0.1

# ASN specific params
hid_dim_vae: 128
step: 3

lambda_r: 1.0
lambda_d: 0.1
lambda_f: 0.001

adv_dim: 10