name: "ACDNE"
gnn: "gcn" # not used

num_layers: 0
hid_dim: 64
dropout_ratio: 0

# filename: "gnn_test.txt"
activation: "relu"

mode: "node"

# for each hop, the number of neighbors to sample
num_neigh: -1 ### need to find the best number of neighbors
batch_size: 100

optimizer: "Adam"
lr: 0.004
weight_decay: 0.0
epochs: 100

# ACDNE specific parameters
n_emb: 128
pair_weight: 0.1
step: 3
