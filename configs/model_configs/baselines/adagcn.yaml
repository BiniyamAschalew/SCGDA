# nn:
name: "ADAGCN"
gnn: "gcn" # gcn, prop allowed for adagcn

num_layers: 3
hid_dim: 64
dropout_ratio: 0.0

# filename: "gnn_test.txt"
activation: "relu"
mode: "node"

# for each hop, the number of neighbors to sample
num_neigh: -1 ### need to find the best number of neighbors
batch_size: 0

optimizer: "Adam"
lr: 0.004
weight_decay: 0.0

epochs: 100
domain_weight: 1.0
gp_weight: 5.0
adv_dim: 40