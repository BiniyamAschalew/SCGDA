# nn:
name: "SimGDA_Role"
gnn: "gcn"

num_layers: 2
hid_dim: 64
dropout_ratio: 0

# filename: "gnn_test.txt"
activation: "relu"

mode: "node"

# for each hop, the number of neighbors to sample
num_neigh: -1 ### need to find the best number of neighbors
batch_size: 0

optimizer: "Adam"
lr: 0.01
weight_decay: 0.001


mmd: True
mmd_weight: 0.1

# role specific settings
role_type: signal_role
role_operator: "sym" # "rw" or "sym"
role_dim: 8
role_weight: 1.0