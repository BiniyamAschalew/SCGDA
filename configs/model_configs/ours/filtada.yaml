name: "FiltADA"
gnn: "filter_mono"

num_layers: 3
hid_dim: 64
dropout_ratio: 0.0
activation: "relu"
mode: "node"

num_neigh: -1
batch_size: 0

optimizer: "Adam"
lr: 0.004
weight_decay: 0.0

epochs: 100
domain_weight: 1.0
probe_domain_weight: 0.2
gp_weight: 5.0
adv_dim: 40

# learnable filter settings (fixed depth for now)
filter_depth: 4
s_pnums: 0
t_pnums: 1
source_filter_init: [0.25, 0.25, 0.25, 0.25]
target_filter_init: [0.25, 0.25, 0.25, 0.25]
filter_temperature: 1.0
filter_l1_weight: 0.1
