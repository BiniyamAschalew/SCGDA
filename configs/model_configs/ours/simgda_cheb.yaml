# SimGDACheb: SimGDA with Chebyshev polynomial filters
name: "simgda_cheb"
gnn: "cheb"

# Architecture
num_layers: 2
hid_dim: 128
dropout_ratio: 0.1
activation: "relu"

# Chebyshev filter parameters
cheb_K: 3
cheb_norm: "sym"
cheb_bias: true

# Domain adaptation
mmd_weight: 0.1

# Training
mode: "node"
num_neigh: -1
batch_size: 0

optimizer: "Adam"
lr: 0.01
weight_decay: 0.001

# Probe settings
probe_type: "gaussian"
probe_mmd_weight: 0.1
probe_mean: 1.0
probe_std: 0.5