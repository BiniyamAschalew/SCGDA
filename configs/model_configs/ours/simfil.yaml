name: "SimFil"
gnn: "cheb"
spectral_filter: "cheb"

num_layers: 2
hid_dim: 64
dropout_ratio: 0.1

activation: "relu"
mode: "node"

num_neigh: -1
batch_size: 0

optimizer: "Adam"
lr: 0.001
weight_decay: 0.01

mmd: True
mmd_weight: 0.1

# learnable spectral filter settings
# use spectral_filter: "cheb" (DLIT-style) or "bern" (DGSDA-style)
K: 3
cheb_norm: "sym"

# optional filter-alignment warmup
warmup_epochs: 0
warmup_init: "gaussian"
warmup_mmd_weight: 1.0
warmup_lr: 0.01
warmup_weight_decay: 0.001
warmup_static_value: 1.0
