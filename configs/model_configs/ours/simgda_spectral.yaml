# nn:
name: "SimGDA_Spectral"
gnn: "cheb"
spectral_filter: "cheb"

num_layers: 2
hid_dim: 64
dropout_ratio: 0.1

# filename: "gnn_test.txt"
activation: "relu"
mode: "node"

# for each hop, the number of neighbors to sample
num_neigh: -1 ### need to find the best number of neighbors
batch_size: 0

optimizer: "Adam"
lr: 0.001
weight_decay: 0.01

mmd: True
mmd_weight: 0.1

# spectral filter settings
K: 3
cheb_norm: "sym"

# warmup settings (set warmup_epochs > 0 to enable)
warmup_epochs: 0
warmup_init: "gaussian"
warmup_mmd_weight: 1.0

warmup_lr: 0.01
warmup_weight_decay: 0.001
warmup_static_value: 1.0
